openapi: 3.1.0
info:
  title: Atlas Commerce — API candidata v1
  version: 0.3.0-proposta
  description: Contrato de transporte DOCUMENTAL, não API implantada. B2C demo pessoal, Stripe Test Mode, NestJS auth,
    Vercel Hobby/Render Free/Supabase Free. Rotas/DTOs propostos sujeitos a revisão F04-02. Sem compromisso de operação
    comercial.
x-atlas-status: PROPOSTO_NAO_IMPLEMENTADO
x-atlas-identity-id01: CUSTOMER_IMPLEMENTADO_LOCAL_CI_REMOTO_PENDENTE_PUBLICO_BLOQUEADO
x-atlas-delta: UXD-16 obrigatorio/anulavel ratificado pelo responsavel em 2026-10-13; demais CT-10/Stripe propostos ou pendentes, sem implementacao
x-atlas-stripe-api-sdk-ui-mode: PENDENTE_DE_VERSAO_EXATA_E_PROVA
servers:
- url: /
  description: Origem relativa loja/admin ou Render, conforme proxy seguro testado
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-atlas_session
      description: Cookie host-only por site, classe server-side, opaco; nome final deve ser validado em F04-06.
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Opcional para correlação, backend normaliza; valor não é autoridade.
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 16
      description: Token de CSRF vinculado à origem/session context. Exigido com validação Origin/Referer nas mutações
        browser.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9._~-]+$
      description: Chave aleatória pelo cliente, escopo ator+operação, persistida com fingerprint.
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    EntitlementId:
      name: entitlementId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    RefundRequestId:
      name: refundRequestId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
  schemas:
    OpaqueId:
      type: string
      minLength: 8
      maxLength: 128
      description: ID opaco, não uma autorização; formato físico a confirmar.
    Money:
      type: object
      additionalProperties: false
      required:
      - currency
      - amountCents
      properties:
        currency:
          type: string
          const: BRL
        amountCents:
          type: integer
          format: int64
          minimum: 0
          description: Inteiro em centavos; não aceitar float.
    ProductSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - productType
      - price
      - previewAvailable
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        title:
          type: string
        productType:
          type: string
          enum:
          - PHYSICAL_BOOK
          - EBOOK
          - DIGITAL_MAGAZINE
          - KIT
        price:
          $ref: '#/components/schemas/Money'
        previewAvailable:
          type: boolean
        description:
          type: string
    ProductList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        nextCursor:
          type:
          - string
          - 'null'
    Me:
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "email"
        - "sessionClass"
      "properties":
        "id":
          "$ref": "#/components/schemas/OpaqueId"
        "email":
          "type": "string"
          "format": "email"
          "maxLength": 254
        "sessionClass":
          "type": "string"
          "const": "CUSTOMER"
    CsrfResponse:
      type: object
      additionalProperties: false
      required:
      - csrfToken
      properties:
        csrfToken:
          type: string
          minLength: 16
    LoginRequest:
      "type": "object"
      "additionalProperties": false
      "required":
        - "email"
        - "password"
        - "context"
      "properties":
        "email":
          "type": "string"
          "format": "email"
          "maxLength": 254
        "password":
          "type": "string"
          "minLength": 1
          "maxLength": 128
          "x-normalization": "NFC"
        "context":
          "type": "string"
          "enum":
            - "CUSTOMER"
            - "STAFF"
          "description": "ID-01 aceita CUSTOMER; STAFF e negado com 403, sem MFA/sessao."
    LoginResult:
      "type": "object"
      "additionalProperties": false
      "required":
        - "state"
      "properties":
        "state":
          "type": "string"
          "const": "AUTHENTICATED"
    MfaVerifyRequest:
      type: object
      additionalProperties: false
      required:
      - challengeId
      - method
      properties:
        challengeId:
          $ref: '#/components/schemas/OpaqueId'
        method:
          type: string
          enum:
          - TOTP
          - WEBAUTHN
        totpCode:
          type: string
          pattern: ^[0-9]{6}$
        webauthnAssertion:
          type: object
          description: Estrutura WebAuthn exata e limites serão detalhados no AUTH spike; não confiar em assertion
            sem origin/RP ID/UV e challenge.
          additionalProperties: true
      oneOf:
      - required:
        - totpCode
      - required:
        - webauthnAssertion
      description: Um único método, purpose-bound, válido antes de sessão de equipe.
    IdentityRegisterRequest:
      "type": "object"
      "additionalProperties": false
      "required":
        - "email"
        - "password"
      "properties":
        "email":
          "type": "string"
          "format": "email"
          "maxLength": 254
        "password":
          "type": "string"
          "minLength": 15
          "maxLength": 128
          "x-normalization": "NFC"
    IdentityEmailRequest:
      "type": "object"
      "additionalProperties": false
      "required":
        - "email"
      "properties":
        "email":
          "type": "string"
          "format": "email"
          "maxLength": 254
    IdentityTokenRequest:
      "type": "object"
      "additionalProperties": false
      "required":
        - "token"
      "properties":
        "token":
          "type": "string"
          "pattern": "^[A-Za-z0-9_-]{43}$"
    IdentityRecoveryCompleteRequest:
      "type": "object"
      "additionalProperties": false
      "required":
        - "token"
        - "password"
      "properties":
        "token":
          "type": "string"
          "pattern": "^[A-Za-z0-9_-]{43}$"
        "password":
          "type": "string"
          "minLength": 15
          "maxLength": 128
          "x-normalization": "NFC"
    IdentityEmptyRequest:
      "type": "object"
      "additionalProperties": false
      "required": []
      "properties": {}
    IdentityAccepted:
      "type": "object"
      "additionalProperties": false
      "required":
        - "state"
      "properties":
        "state":
          "type": "string"
          "const": "ACCEPTED"
    QuoteLineRequest:
      type: object
      additionalProperties: false
      required:
      - productId
      - quantity
      properties:
        productId:
          $ref: '#/components/schemas/OpaqueId'
        quantity:
          type: integer
          minimum: 1
          maximum: 9999
    QuoteRequest:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/QuoteLineRequest'
        couponCode:
          type: string
          maxLength: 64
        shippingAddressId:
          $ref: '#/components/schemas/OpaqueId'
    QuoteResult:
      type: object
      additionalProperties: false
      required:
      - quoteId
      - expiresAt
      - total
      properties:
        quoteId:
          $ref: '#/components/schemas/OpaqueId'
        expiresAt:
          type: string
          format: date-time
        total:
          $ref: '#/components/schemas/Money'
        note:
          type: string
          description: Cotação não garante saldo nem dispensa revalidação no checkout.
    CheckoutRequest:
      type: object
      additionalProperties: false
      required:
      - quoteId
      properties:
        quoteId:
          $ref: '#/components/schemas/OpaqueId'
    CheckoutResult:
      type: object
      additionalProperties: false
      description: UXD-16 obrigatorio/anulavel aprovado pelo responsavel em 2026-10-13; demais CT-10 propostos, nao implementados ou homologados.
      x-atlas-ratification: UXD16_APROVADO_RESPONSAVEL_2026_10_13_DEMAIS_CT10_PROPOSTOS
      required:
      - orderId
      - state
      - reservationExpiresAt
      - payment
      properties:
        orderId:
          $ref: '#/components/schemas/OpaqueId'
        state:
          type: string
          enum:
          - PENDING_PAYMENT
          - PAYMENT_REVIEW
          - PAID
          - CANCELLED
          - IN_FULFILLMENT
          - PARTIALLY_FULFILLED
          - FULFILLED
        reservationExpiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: UXD-16 aprovado em 2026-10-13; campo sempre presente, string UTC/RFC3339 da reserva real com componente fisico (inclusive kit misto), null no exclusivamente digital. Sem TTL fisico ficticio; correspondencia deve ser validada pelo snapshot persistido.
          x-atlas-ratification: APROVADO_RESPONSAVEL_2026_10_13
        payment:
          type: object
          additionalProperties: false
          required:
          - presentation
          - sessionStatus
          properties:
            presentation:
              type: string
              const: EMBEDDED
              description: Enum Atlas de apresentacao; nao e o enum ui_mode Stripe, cuja versao e prova continuam pendentes.
            sessionStatus:
              type: string
              enum:
              - PENDING
              - READY
              - RECONCILIATION_REQUIRED
              description: Projecao de prontidao da Checkout Session, NAO estado financeiro SM-02 nem prova de PAID.
            clientSecret:
              type: string
              minLength: 1
              readOnly: true
              x-atlas-sensitive: true
              description: Client secret de Checkout Session exclusivamente para SDK Stripe do titular autenticado; TLS/no-store, sem log/URL/cache/SSR/analytics. Nao e chave API nem prova de pagamento.
            sessionExpiresAt:
              type:
              - string
              - 'null'
              format: date-time
              description: Timestamp real da sessao, obrigatorio e nao nulo em READY; ausente/null se desconhecido nos estados pendentes.
          allOf:
          - if:
              properties:
                sessionStatus:
                  const: READY
              required:
              - sessionStatus
            then:
              required:
              - clientSecret
              - sessionExpiresAt
              properties:
                sessionExpiresAt:
                  type: string
                  format: date-time
            else:
              not:
                required:
                - clientSecret
    OrderView:
      type: object
      additionalProperties: false
      required:
      - id
      - state
      - total
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        state:
          type: string
          enum:
          - PENDING_PAYMENT
          - PAYMENT_REVIEW
          - PAID
          - CANCELLED
          - IN_FULFILLMENT
          - PARTIALLY_FULFILLED
          - FULFILLED
        total:
          $ref: '#/components/schemas/Money'
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - productId
            - quantity
            - unitPrice
            properties:
              productId:
                $ref: '#/components/schemas/OpaqueId'
              quantity:
                type: integer
                minimum: 1
              unitPrice:
                $ref: '#/components/schemas/Money'
    EntitlementView:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - state
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        title:
          type: string
        state:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - REVOKED
    LibraryList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EntitlementView'
        nextCursor:
          type:
          - string
          - 'null'
    LibraryAccessResult:
      type: object
      additionalProperties: false
      required:
      - temporaryUrl
      - expiresAt
      properties:
        temporaryUrl:
          type: string
          format: uri
          description: URL assinada R2 de curta validade sem garantia de revogação imediata.
        expiresAt:
          type: string
          format: date-time
    RefundRequestCreate:
      type: object
      additionalProperties: false
      required:
      - orderId
      - amountCents
      - reasonCode
      properties:
        orderId:
          $ref: '#/components/schemas/OpaqueId'
        amountCents:
          type: integer
          format: int64
          minimum: 1
        reasonCode:
          type: string
          maxLength: 80
    RefundApprovalRequest:
      type: object
      additionalProperties: false
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
        reasonCode:
          type: string
          maxLength: 80
    RefundOperationAccepted:
      type: object
      additionalProperties: false
      required:
      - refundRequestId
      - state
      properties:
        refundRequestId:
          $ref: '#/components/schemas/OpaqueId'
        state:
          type: string
          enum:
          - REQUESTED
          - APPROVED
          - REJECTED
          - RECONCILIATION_REQUIRED
    ProblemDetails:
      type: object
      required:
      - type
      - title
      - status
      - code
      - requestId
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        requestId:
          type: string
    HealthResult:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          - unavailable
paths:
  /api/v1/catalog/products:
    get:
      operationId: listCatalogProducts
      tags:
      - Catalog
      summary: Listar produtos publicados
      responses:
        '200':
          description: Produtos públicos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        '429':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 2048
  /api/v1/catalog/products/{productId}:
    get:
      operationId: getCatalogProduct
      tags:
      - Catalog
      summary: Consultar produto público
      responses:
        '200':
          description: Produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSummary'
        '404':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security: []
      parameters:
      - $ref: '#/components/parameters/ProductId'
  /api/v1/auth/csrf:
    "get":
      "tags":
        - "Identity"
      "operationId": "id01auth_csrf"
      "summary": "PROPOSTA ID-01: GET /api/v1/auth/csrf"
      "x-id01-status": "LOCAL_CI_SOMENTE_CUSTOMER_NAO_HOMOLOGADO"
      "description": "CT-ID-01: disabled por padrao; e-mail fake somente no processo de teste, publico bloqueado. Origin/Referer, JSON-only 4KiB, CSRF vinculado para mutacoes, limites persistentes, no-store. Sem concessao STAFF, sem mudanca de checkout/UXD-16. localhost nao homologa HTTPS/proxy publico."
      "security": []
      "parameters":
        -
          "name": "Origin"
          "in": "header"
          "required": true
          "schema":
            "type": "string"
          "description": "ID-01: origem loopback exata configurada; hosts publicos/proxy pendentes."
      "responses":
        "200":
          "description": "Resultado Identity Customer ID-01"
          "headers":
            "Cache-Control":
              "schema":
                "type": "string"
                "const": "no-store"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/CsrfResponse"
        "400":
          "description": "Erro publico RFC9457 sem dados sensiveis"
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetails"
        "401":
          "description": "Erro publico RFC9457 sem dados sensiveis"
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetails"
        "403":
          "description": "Erro publico RFC9457 sem dados sensiveis"
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetails"
        "429":
          "description": "Erro publico RFC9457 sem dados sensiveis"
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetails"
          "headers":
            "Retry-After":
              "schema":
                "type": "integer"
                "minimum": 1
        "503":
          "description": "Erro publico RFC9457 sem dados sensiveis"
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetails"
  /api/v1/auth/login:
    "post":
      "tags":
        - "Identity"
      "operationId": "id01auth_login"
      "summary": "PROPOSTA ID-01: POST /api/v1/auth/login"
      "x-id01-status": "LOCAL_CI_SOMENTE_CUSTOMER_NAO_HOMOLOGADO"
      "description": "CT-ID-01: disabled por padrao; e-mail fake somente no processo de teste, publico bloqueado. Origin/Referer, JSON-only 4KiB, CSRF vinculado para mutacoes, limites persistentes, no-store. Sem concessao STAFF, sem mudanca de checkout/UXD-16. localhost nao homologa HTTPS/proxy publico."
      "security": []
      "parameters":
        -
          "name": "Origin"
          "in": "header"
          "required": true
          "schema":
            "type": "string"
          "description": "ID-01: origem loopback exata configurada; hosts publicos/proxy pendentes."
        -
          "$ref": "#/components/parameters/CsrfToken"
      "responses":
        "200":
          "description": "Resultado Identity Customer ID-01"
          "headers":
            "Cache-Control":
              "schema":
                "type": "string"
                "const": "no-store"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/LoginResult"
        "400":
          "description": "Erro publico RFC9457 sem dados sensiveis"
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetails"
        "401":
          "description": "Erro publico RFC9457 sem dados sensiveis"
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetails"
        "403":
          "description": "Erro publico RFC9457 sem dados sensiveis"
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetails"
        "429":
          "description": "Erro publico RFC9457 sem dados sensiveis"
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetails"
          "headers":
            "Retry-After":
              "schema":
                "type": "integer"
                "minimum": 1
        "503":
          "description": "Erro publico RFC9457 sem dados sensiveis"
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetails"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/LoginRequest"
  /api/v1/auth/mfa/verify:
    post:
      operationId: verifyMfaChallenge
      tags:
      - Identity
      summary: Concluir desafio MFA antes de sessão de equipe
      x-id01-status: BLOQUEADO_NAO_IMPLEMENTADO
      responses:
        '204':
          description: Sessão staff criada e cookie definido
        '400':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
  /api/v1/auth/logout:
    "post":
      "tags":
        - "Identity"
      "operationId": "id01auth_logout"
      "summary": "PROPOSTA ID-01: POST /api/v1/auth/logout"
      "x-id01-status": "LOCAL_CI_SOMENTE_CUSTOMER_NAO_HOMOLOGADO"
      "description": "CT-ID-01: disabled por padrao; e-mail fake somente no processo de teste, publico bloqueado. Origin/Referer, JSON-only 4KiB, CSRF vinculado para mutacoes, limites persistentes, no-store. Sem concessao STAFF, sem mudanca de checkout/UXD-16. localhost nao homologa HTTPS/proxy publico."
      "security":
        -
          "sessionCookie": []
      "parameters":
        -
          "name": "Origin"
          "in": "header"
          "required": true
          "schema":
            "type": "string"
          "description": "ID-01: origem loopback exata configurada; hosts publicos/proxy pendentes."
        -
          "$ref": "#/components/parameters/CsrfToken"
      "responses":
        "204":
          "description": "Resultado Identity Customer ID-01"
          "headers":
            "Cache-Control":
              "schema":
                "type": "string"
                "const": "no-store"
        "400":
          "description": "Erro publico RFC9457 sem dados sensiveis"
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetails"
        "401":
          "description": "Erro publico RFC9457 sem dados sensiveis"
          "content":
            "application/problem+json":
              "schema":
