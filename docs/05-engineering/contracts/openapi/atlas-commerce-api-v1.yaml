openapi: 3.1.0
info:
  title: Atlas Commerce — API candidata v1
  version: 0.2.0-proposta
  description: Contrato de transporte DOCUMENTAL, não API implantada. B2C demo pessoal, Stripe Test Mode, NestJS auth,
    Vercel Hobby/Render Free/Supabase Free. Rotas/DTOs propostos sujeitos a revisão F04-02. Sem compromisso de operação
    comercial.
x-atlas-status: PROPOSTO_NAO_IMPLEMENTADO
servers:
- url: /
  description: Origem relativa loja/admin ou Render, conforme proxy seguro testado
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-atlas_session
      description: Cookie host-only por site, classe server-side, opaco; nome final deve ser validado em F04-06.
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Opcional para correlação, backend normaliza; valor não é autoridade.
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 16
      description: Token de CSRF vinculado à origem/session context. Exigido com validação Origin/Referer nas mutações
        browser.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9._~-]+$
      description: Chave aleatória pelo cliente, escopo ator+operação, persistida com fingerprint.
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    EntitlementId:
      name: entitlementId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    RefundRequestId:
      name: refundRequestId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
  schemas:
    OpaqueId:
      type: string
      minLength: 8
      maxLength: 128
      description: ID opaco, não uma autorização; formato físico a confirmar.
    Money:
      type: object
      additionalProperties: false
      required:
      - currency
      - amountCents
      properties:
        currency:
          type: string
          const: BRL
        amountCents:
          type: integer
          format: int64
          minimum: 0
          description: Inteiro em centavos; não aceitar float.
    ProductSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - productType
      - price
      - previewAvailable
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        title:
          type: string
        productType:
          type: string
          enum:
          - PHYSICAL_BOOK
          - EBOOK
          - DIGITAL_MAGAZINE
          - KIT
        price:
          $ref: '#/components/schemas/Money'
        previewAvailable:
          type: boolean
        description:
          type: string
    ProductList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        nextCursor:
          type:
          - string
          - 'null'
    Me:
      type: object
      additionalProperties: false
      required:
      - id
      - displayName
      - sessionClass
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        displayName:
          type: string
        sessionClass:
          type: string
          enum:
          - CUSTOMER
          - STAFF
    CsrfResponse:
      type: object
      additionalProperties: false
      required:
      - csrfToken
      properties:
        csrfToken:
          type: string
          minLength: 16
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      - context
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
        context:
          type: string
          enum:
          - CUSTOMER
          - STAFF
    LoginResult:
      type: object
      additionalProperties: false
      required:
      - state
      properties:
        state:
          type: string
          enum:
          - AUTHENTICATED
          - MFA_REQUIRED
        challengeId:
          $ref: '#/components/schemas/OpaqueId'
    MfaVerifyRequest:
      type: object
      additionalProperties: false
      required:
      - challengeId
      - method
      properties:
        challengeId:
          $ref: '#/components/schemas/OpaqueId'
        method:
          type: string
          enum:
          - TOTP
          - WEBAUTHN
        totpCode:
          type: string
          pattern: ^[0-9]{6}$
        webauthnAssertion:
          type: object
          description: Estrutura WebAuthn exata e limites serão detalhados no AUTH spike; não confiar em assertion
            sem origin/RP ID/UV e challenge.
          additionalProperties: true
      oneOf:
      - required:
        - totpCode
      - required:
        - webauthnAssertion
      description: Um único método, purpose-bound, válido antes de sessão de equipe.
    QuoteLineRequest:
      type: object
      additionalProperties: false
      required:
      - productId
      - quantity
      properties:
        productId:
          $ref: '#/components/schemas/OpaqueId'
        quantity:
          type: integer
          minimum: 1
          maximum: 9999
    QuoteRequest:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/QuoteLineRequest'
        couponCode:
          type: string
          maxLength: 64
        shippingAddressId:
          $ref: '#/components/schemas/OpaqueId'
    QuoteResult:
      type: object
      additionalProperties: false
      required:
      - quoteId
      - expiresAt
      - total
      properties:
        quoteId:
          $ref: '#/components/schemas/OpaqueId'
        expiresAt:
          type: string
          format: date-time
        total:
          $ref: '#/components/schemas/Money'
        note:
          type: string
          description: Cotação não garante saldo nem dispensa revalidação no checkout.
    CheckoutRequest:
      type: object
      additionalProperties: false
      required:
      - quoteId
      properties:
        quoteId:
          $ref: '#/components/schemas/OpaqueId'
    CheckoutResult:
      type: object
      additionalProperties: false
      required:
      - orderId
      - state
      - reservationExpiresAt
      - payment
      properties:
        orderId:
          $ref: '#/components/schemas/OpaqueId'
        state:
          type: string
          enum:
          - PENDING_PAYMENT
          - PAYMENT_REVIEW
          - PAID
          - CANCELLED
          - IN_FULFILLMENT
          - PARTIALLY_FULFILLED
          - FULFILLED
        reservationExpiresAt:
          type: string
          format: date-time
        payment:
          type: object
          additionalProperties: false
          required:
          - sessionStatus
          properties:
            sessionStatus:
              type: string
              enum:
              - PENDING
              - READY
              - RECONCILIATION_REQUIRED
              description: Projeção de prontidão da sessão Checkout, NÃO estado financeiro do SM-02.
            checkoutUrl:
              type: string
              format: uri
              description: URL de checkout hospedado test mode; somente quando válida, sem cache/log.
            sessionExpiresAt:
              type: string
              format: date-time
    OrderView:
      type: object
      additionalProperties: false
      required:
      - id
      - state
      - total
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        state:
          type: string
          enum:
          - PENDING_PAYMENT
          - PAYMENT_REVIEW
          - PAID
          - CANCELLED
          - IN_FULFILLMENT
          - PARTIALLY_FULFILLED
          - FULFILLED
        total:
          $ref: '#/components/schemas/Money'
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - productId
            - quantity
            - unitPrice
            properties:
              productId:
                $ref: '#/components/schemas/OpaqueId'
              quantity:
                type: integer
                minimum: 1
              unitPrice:
                $ref: '#/components/schemas/Money'
    EntitlementView:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - state
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        title:
          type: string
        state:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - REVOKED
    LibraryList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EntitlementView'
        nextCursor:
          type:
          - string
          - 'null'
    LibraryAccessResult:
      type: object
      additionalProperties: false
      required:
      - temporaryUrl
      - expiresAt
      properties:
        temporaryUrl:
          type: string
          format: uri
          description: URL assinada R2 de curta validade sem garantia de revogação imediata.
        expiresAt:
          type: string
          format: date-time
    RefundRequestCreate:
      type: object
      additionalProperties: false
      required:
      - orderId
      - amountCents
      - reasonCode
      properties:
        orderId:
          $ref: '#/components/schemas/OpaqueId'
        amountCents:
          type: integer
          format: int64
          minimum: 1
        reasonCode:
          type: string
          maxLength: 80
    RefundApprovalRequest:
      type: object
      additionalProperties: false
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
        reasonCode:
          type: string
          maxLength: 80
    RefundOperationAccepted:
      type: object
      additionalProperties: false
      required:
      - refundRequestId
      - state
      properties:
        refundRequestId:
          $ref: '#/components/schemas/OpaqueId'
        state:
          type: string
          enum:
          - REQUESTED
          - APPROVED
          - REJECTED
          - RECONCILIATION_REQUIRED
    ProblemDetails:
      type: object
      required:
      - type
      - title
      - status
      - code
      - requestId
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        requestId:
          type: string
    HealthResult:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          - unavailable
paths:
  /api/v1/catalog/products:
    get:
      operationId: listCatalogProducts
      tags:
      - Catalog
      summary: Listar produtos publicados
      responses:
        '200':
          description: Produtos públicos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        '429':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 2048
  /api/v1/catalog/products/{productId}:
    get:
      operationId: getCatalogProduct
      tags:
      - Catalog
      summary: Consultar produto público
      responses:
        '200':
          description: Produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSummary'
        '404':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security: []
      parameters:
      - $ref: '#/components/parameters/ProductId'
  /api/v1/auth/csrf:
    get:
      operationId: getCsrfBootstrap
      tags:
      - Identity
      summary: Solicitar token antifalsificação
      responses:
        '200':
          description: CSRF bootstrap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
        '429':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security: []
      description: O valor pertence ao contexto/origem do browser e não deve ser publicamente cacheado.
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
      - Identity
      summary: Autenticar cliente ou iniciar desafio MFA staff
      responses:
        '200':
          description: Sessão cliente criada ou resultado autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '202':
          description: Desafio MFA pendente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /api/v1/auth/mfa/verify:
    post:
      operationId: verifyMfaChallenge
      tags:
      - Identity
      summary: Concluir desafio MFA antes de sessão de equipe
      responses:
        '204':
          description: Sessão staff criada e cookie definido
        '400':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
      - Identity
      summary: Revogar sessão ativa
      responses:
        '204':
          description: Sessão invalidada
        '401':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
  /api/v1/me:
    get:
      operationId: getMe
      tags:
      - Identity
      summary: Sessão atual
      responses:
        '200':
          description: Perfil mínimo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - sessionCookie: []
  /api/v1/checkout/quotes:
    post:
      operationId: createQuote
      tags:
      - Pricing
      summary: Cotação calculada no servidor
      responses:
        '200':
          description: Cotação derivada do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResult'
        '400':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
  /api/v1/checkouts:
    post:
      operationId: createCheckout
      tags:
      - Orders
      summary: Criar checkout idempotente
      responses:
        '201':
          description: Sessão Stripe test pronta e prazo válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResult'
        '202':
          description: Checkout persistido, PSP pendente/reconciliação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResult'
        '400':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      description: A API nunca confirma cobrança pelo redirect. Em 201, checkoutUrl só após session Stripe compatível
        40/30/5. Em 202, estado PENDING sem URL obrigatória.
  /api/v1/me/orders/{orderId}:
    get:
      operationId: getMyOrder
      tags:
      - Orders
      summary: Consultar pedido próprio sem enumeração
      responses:
        '200':
          description: Pedido com snapshot público
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderView'
        '401':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/OrderId'
  /api/v1/me/library:
    get:
      operationId: listMyLibrary
      tags:
      - Library
      summary: Listar biblioteca do titular
      responses:
        '200':
          description: Entitlements filtrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryList'
        '401':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - sessionCookie: []
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 2048
  /api/v1/me/library/{entitlementId}/access:
    post:
      operationId: requestLibraryAccess
      tags:
      - Library
      summary: Solicitar URL temporária após direito de acesso
      responses:
        '200':
          description: URL temporária
          content:
            application/json:
