  /api/v1/checkouts:
    post:
      operationId: createCheckout
      tags:
      - Orders
      summary: Criar checkout idempotente
      responses:
        '201':
          description: Sessao Stripe Test Mode READY e elegivel para montagem EMBEDDED; nao confirma PAID.
          headers:
            Cache-Control:
              description: Resposta autenticada sem armazenamento.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CheckoutResult'
                - type: object
                  properties:
                    payment:
                      properties:
                        sessionStatus:
                          const: READY
        '202':
          description: Intencao persistida, PSP pendente/reconciliacao, sem clientSecret ou prontidao ficticia.
          headers:
            Cache-Control:
              description: Resposta autenticada sem armazenamento.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CheckoutResult'
                - type: object
                  properties:
                    payment:
                      properties:
                        sessionStatus:
                          enum:
                          - PENDING
                          - RECONCILIATION_REQUIRED
        '400':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Erro público sem dados sensíveis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      description: Proposta CT-10, nao implantada. Em 201, presentation EMBEDDED e sessionStatus READY
        com clientSecret e sessionExpiresAt reais somente apos owner e elegibilidade; 40/30/5 quando houver reserva fisica.
        Em 202, sessionStatus PENDING/RECONCILIATION_REQUIRED e clientSecret proibido. Estado do pedido permanece SM-01.
        TLS/no-store, sem segredo em URL/log/cache/SSR/analytics; callback/completion/return nao confirmam PAID.
        API/SDK/ui_mode e return_url condicionais a versao exata e prova; success_url hosted nao integra este delta.
        Somente reservationExpiresAt obrigatorio/anulavel (UXD-16) ratificado pelo responsavel em 2026-10-13; demais CT-10/Stripe seguem propostos ou pendentes.
