<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1226" version="1.1" viewBox="0 0 1720 1226" width="1720" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow-normal" markerHeight="9" markerWidth="9" orient="auto" refX="9" refY="4.5"><path d="M 0 0 L 9 4.5 L 0 9 z" fill="#334155" /></marker><marker id="arrow-note" markerHeight="9" markerWidth="9" orient="auto" refX="9" refY="4.5"><path d="M 0 0 L 9 4.5 L 0 9 z" fill="#64748b" /></marker></defs><rect fill="white" height="1226" width="1720" x="0" y="0" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="22" font-weight="bold" text-anchor="middle" x="860.0" y="38">SQ-02 • Webhook, duplicidade e fulfillment</text><line stroke="#94a3b8" stroke-dasharray="7,5" stroke-width="1.6" x1="135.0" x2="135.0" y1="94" y2="1191" /><rect fill="#eff6ff" height="52" rx="9" stroke="#1d4ed8" stroke-width="1.5" width="212" x="29.0" y="64" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="14" font-weight="bold" text-anchor="middle" x="135.0" y="95">Provedor</text><line stroke="#94a3b8" stroke-dasharray="7,5" stroke-width="1.6" x1="425.0" x2="425.0" y1="94" y2="1191" /><rect fill="#f0fdfa" height="52" rx="9" stroke="#0f766e" stroke-width="1.5" width="212" x="319.0" y="64" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="14" font-weight="bold" text-anchor="middle" x="425.0" y="95">Webhook API</text><line stroke="#94a3b8" stroke-dasharray="7,5" stroke-width="1.6" x1="715.0" x2="715.0" y1="94" y2="1191" /><rect fill="#eff6ff" height="52" rx="9" stroke="#1d4ed8" stroke-width="1.5" width="212" x="609.0" y="64" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="14" font-weight="bold" text-anchor="middle" x="715.0" y="95">Validação</text><line stroke="#94a3b8" stroke-dasharray="7,5" stroke-width="1.6" x1="1005.0" x2="1005.0" y1="94" y2="1191" /><rect fill="#f0fdfa" height="52" rx="9" stroke="#0f766e" stroke-width="1.5" width="212" x="899.0" y="64" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="14" font-weight="bold" text-anchor="middle" x="1005.0" y="95">PostgreSQL</text><line stroke="#94a3b8" stroke-dasharray="7,5" stroke-width="1.6" x1="1295.0" x2="1295.0" y1="94" y2="1191" /><rect fill="#eff6ff" height="52" rx="9" stroke="#1d4ed8" stroke-width="1.5" width="212" x="1189.0" y="64" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="14" font-weight="bold" text-anchor="middle" x="1295.0" y="95">Fulfillment</text><line stroke="#94a3b8" stroke-dasharray="7,5" stroke-width="1.6" x1="1585.0" x2="1585.0" y1="94" y2="1191" /><rect fill="#f0fdfa" height="52" rx="9" stroke="#0f766e" stroke-width="1.5" width="212" x="1479.0" y="64" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="14" font-weight="bold" text-anchor="middle" x="1585.0" y="95">Notificações</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="147.0" x2="411.0" y1="163" y2="163" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="280.0" y="137">1. Enviar evento de pagamento</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="437.0" x2="701.0" y1="240" y2="240" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="570.0" y="200">2. Verificar assinatura, escopo e</text><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="570.0" y="214">identificadores</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="703.0" x2="439.0" y1="317" y2="317" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="570.0" y="291">3. Autenticidade comprovada ou rejeição</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="437.0" x2="991.0" y1="394" y2="394" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="715.0" y="354">4. Registrar evento único por origem e</text><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="715.0" y="368">identificador</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="993.0" x2="439.0" y1="471" y2="471" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="715.0" y="445">5. Novo evento ou repetição</text><rect fill="#fffbeb" height="60" rx="7" stroke="#f59e0b" stroke-width="1.2" width="770.0" x="330.0" y="498" /><text fill="#78350f" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="715.0" y="522">Se duplicado, devolver 2xx e encerrar. Os passos seguintes são apenas para</text><text fill="#78350f" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="715.0" y="537">eventos novos.</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="437.0" x2="991.0" y1="625" y2="625" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="715.0" y="585">7. Travar estado; validar moeda, valor, ordem</text><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="715.0" y="599">e reserva</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="993.0" x2="439.0" y1="702" y2="702" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="715.0" y="676">8. Estado consistente ou revisão necessária</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="437.0" x2="991.0" y1="779" y2="779" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="715.0" y="739">9. Confirmar reserva se vigente; persistir</text><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="715.0" y="753">estado e outbox atomicamente</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="413.0" x2="149.0" y1="856" y2="856" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="280.0" y="830">10. ACK 2xx após persistência durável</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="1017.0" x2="1281.0" y1="933" y2="933" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="1150.0" y="893">11. Consumir trabalho pendente de modo</text><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="1150.0" y="907">idempotente</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="1283.0" x2="1019.0" y1="1010" y2="1010" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="1150.0" y="970">12. Conceder digital se elegível; preparar</text><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="1150.0" y="984">remessa se físico</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="1017.0" x2="1571.0" y1="1087" y2="1087" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="1295.0" y="1061">13. Notificação pendente com retry</text></svg>