"899.0" y="64" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="14" font-weight="bold" text-anchor="middle" x="1005.0" y="95">Provedor</text><line stroke="#94a3b8" stroke-dasharray="7,5" stroke-width="1.6" x1="1295.0" x2="1295.0" y1="94" y2="1037" /><rect fill="#eff6ff" height="52" rx="9" stroke="#1d4ed8" stroke-width="1.5" width="212" x="1189.0" y="64" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="14" font-weight="bold" text-anchor="middle" x="1295.0" y="95">Webhook API</text><line stroke="#94a3b8" stroke-dasharray="7,5" stroke-width="1.6" x1="1585.0" x2="1585.0" y1="94" y2="1037" /><rect fill="#f0fdfa" height="52" rx="9" stroke="#0f766e" stroke-width="1.5" width="212" x="1479.0" y="64" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="14" font-weight="bold" text-anchor="middle" x="1585.0" y="95">Atendimento</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="147.0" x2="411.0" y1="163" y2="163" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="280.0" y="123">1. Expirar reserva vencida de forma</text><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="280.0" y="137">idempotente</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="437.0" x2="701.0" y1="240" y2="240" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="570.0" y="200">2. Liberar alocação apenas se ACTIVE e</text><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="570.0" y="214">vencida</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="703.0" x2="439.0" y1="317" y2="317" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="570.0" y="277">3. Reserva EXPIRED; disponibilidade</text><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="570.0" y="291">atualizada</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="1017.0" x2="1281.0" y1="394" y2="394" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="1150.0" y="368">4. Evento aprovado chega após expiração</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="1283.0" x2="729.0" y1="471" y2="471" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="1005.0" y="431">5. Validar evento; consultar tentativa,</text><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="1005.0" y="445">pedido e reserva</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="727.0" x2="1281.0" y1="548" y2="548" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="1005.0" y="522">6. Pagamento aprovado; reserva EXPIRED</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="1283.0" x2="729.0" y1="625" y2="625" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="1005.0" y="585">7. Registrar pagamento e pedido em</text><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="1005.0" y="599">PAYMENT_REVIEW</text><rect fill="#fffbeb" height="60" rx="7" stroke="#f59e0b" stroke-width="1.2" width="770.0" x="620.0" y="652" /><text fill="#78350f" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="1005.0" y="676">Proibido fabricar estoque ou liberar direito digital automaticamente.</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="1283.0" x2="1019.0" y1="779" y2="779" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="1150.0" y="753">9. ACK; processamento preservado</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="1573.0" x2="729.0" y1="856" y2="856" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="1150.0" y="816">10. Analisar nova alocação ou</text><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="1150.0" y="830">compensação/reembolso</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="727.0" x2="1571.0" y1="933" y2="933" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="1150.0" y="907">11. Registrar decisão e trilha de auditoria</text></svg>