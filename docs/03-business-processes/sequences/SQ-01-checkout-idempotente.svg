<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1303" version="1.1" viewBox="0 0 1720 1303" width="1720" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow-normal" markerHeight="9" markerWidth="9" orient="auto" refX="9" refY="4.5"><path d="M 0 0 L 9 4.5 L 0 9 z" fill="#334155" /></marker><marker id="arrow-note" markerHeight="9" markerWidth="9" orient="auto" refX="9" refY="4.5"><path d="M 0 0 L 9 4.5 L 0 9 z" fill="#64748b" /></marker></defs><rect fill="white" height="1303" width="1720" x="0" y="0" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="22" font-weight="bold" text-anchor="middle" x="860.0" y="38">SQ-01 • Checkout idempotente e reserva atômica</text><line stroke="#94a3b8" stroke-dasharray="7,5" stroke-width="1.6" x1="135.0" x2="135.0" y1="94" y2="1268" /><rect fill="#eff6ff" height="52" rx="9" stroke="#1d4ed8" stroke-width="1.5" width="212" x="29.0" y="64" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="14" font-weight="bold" text-anchor="middle" x="135.0" y="95">Cliente</text><line stroke="#94a3b8" stroke-dasharray="7,5" stroke-width="1.6" x1="425.0" x2="425.0" y1="94" y2="1268" /><rect fill="#f0fdfa" height="52" rx="9" stroke="#0f766e" stroke-width="1.5" width="212" x="319.0" y="64" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="14" font-weight="bold" text-anchor="middle" x="425.0" y="95">Loja web</text><line stroke="#94a3b8" stroke-dasharray="7,5" stroke-width="1.6" x1="715.0" x2="715.0" y1="94" y2="1268" /><rect fill="#eff6ff" height="52" rx="9" stroke="#1d4ed8" stroke-width="1.5" width="212" x="609.0" y="64" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="14" font-weight="bold" text-anchor="middle" x="715.0" y="95">Checkout</text><line stroke="#94a3b8" stroke-dasharray="7,5" stroke-width="1.6" x1="1005.0" x2="1005.0" y1="94" y2="1268" /><rect fill="#f0fdfa" height="52" rx="9" stroke="#0f766e" stroke-width="1.5" width="212" x="899.0" y="64" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="14" font-weight="bold" text-anchor="middle" x="1005.0" y="95">Precificação</text><line stroke="#94a3b8" stroke-dasharray="7,5" stroke-width="1.6" x1="1295.0" x2="1295.0" y1="94" y2="1268" /><rect fill="#eff6ff" height="52" rx="9" stroke="#1d4ed8" stroke-width="1.5" width="212" x="1189.0" y="64" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="14" font-weight="bold" text-anchor="middle" x="1295.0" y="95">PostgreSQL</text><line stroke="#94a3b8" stroke-dasharray="7,5" stroke-width="1.6" x1="1585.0" x2="1585.0" y1="94" y2="1268" /><rect fill="#f0fdfa" height="52" rx="9" stroke="#0f766e" stroke-width="1.5" width="212" x="1479.0" y="64" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="14" font-weight="bold" text-anchor="middle" x="1585.0" y="95">Provedor</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="147.0" x2="411.0" y1="163" y2="163" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="280.0" y="137">1. Confirmar valores da cotação</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="437.0" x2="701.0" y1="240" y2="240" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="570.0" y="214">2. POST checkout + chave idempotente</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="727.0" x2="1281.0" y1="317" y2="317" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="1005.0" y="291">3. Consultar chave e fingerprint</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="1283.0" x2="729.0" y1="394" y2="394" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="1005.0" y="368">4. Requisição nova ou resultado existente</text><rect fill="#fffbeb" height="60" rx="7" stroke="#f59e0b" stroke-width="1.2" width="770.0" x="620.0" y="421" /><text fill="#78350f" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="1005.0" y="445">Se chave já resolvida, retornar mesmo pedido e encerrar. Fingerprint</text><text fill="#78350f" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="1005.0" y="460">divergente: rejeitar.</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="727.0" x2="991.0" y1="548" y2="548" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="860.0" y="522">6. Recalcular preço, cupom e frete</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="993.0" x2="729.0" y1="625" y2="625" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="860.0" y="599">7. Cotação consistente</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="727.0" x2="1281.0" y1="702" y2="702" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="1005.0" y="662">8. Transação: revalidar, reservar SKUs e</text><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="1005.0" y="676">cupom, criar snapshot e chave</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="1283.0" x2="729.0" y1="779" y2="779" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="1005.0" y="739">9. Commit: pedido pendente ou conflito</text><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="1005.0" y="753">atômico</text><rect fill="#fffbeb" height="60" rx="7" stroke="#f59e0b" stroke-width="1.2" width="770.0" x="620.0" y="806" /><text fill="#78350f" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="1005.0" y="830">Se falhar, nenhuma reserva parcial pode sobreviver.</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="727.0" x2="1571.0" y1="933" y2="933" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="1150.0" y="893">11. Criar tentativa estável de pagamento</text><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="1150.0" y="907">(sandbox)</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="1573.0" x2="729.0" y1="1010" y2="1010" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="1150.0" y="970">12. Referência do provedor ou falha</text><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="1150.0" y="984">recuperável</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="703.0" x2="439.0" y1="1087" y2="1087" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="570.0" y="1047">13. Pedido pendente + referência / erro</text><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="570.0" y="1061">controlado</text><line marker-end="url(#arrow-normal)" stroke="#334155" stroke-width="1.9" x1="413.0" x2="149.0" y1="1164" y2="1164" /><text fill="#0f172a" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="280.0" y="1138">14. Exibir estado sem presumir quitação</text></svg>