name: atlas-cat01-catalog
services:
  postgres:
    image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
    command: ["postgres", "-c", "atlas.catalog_fixture=atlas-cat01-disposable"]
    environment:
      POSTGRES_USER: atlas_catalog_migrator
      POSTGRES_DB: atlas_catalog_cat01
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - catalog-data:/var/lib/postgresql/data
      - ./test/catalog/runtime-role.sql:/docker-entrypoint-initdb.d/01-runtime-role.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-U",
          "atlas_catalog_migrator",
          "-d",
          "atlas_catalog_cat01",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  catalog-data:
