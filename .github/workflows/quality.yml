name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository checks
        run: pnpm check

      - name: Check whitespace
        run: git diff --check

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start disposable PostgreSQL
        run: docker compose -p atlas-f0404-spike-ci -f apps/api/compose.spike.yml up -d --wait
      - name: Apply disposable fixture migration
        run: pnpm --filter @atlas/api spike:migrate
      - name: Run PostgreSQL concurrency gates
        run: pnpm --filter @atlas/api spike:test
      - name: Cleanup this integration project only
        if: always()
        run: docker compose -p atlas-f0404-spike-ci -f apps/api/compose.spike.yml down --volumes

  identity-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start disposable Identity PostgreSQL
        run: docker compose -p atlas-id01-identity-ci -f apps/api/compose.identity.yml up -d --wait
      - name: Apply isolated Identity migration
        run: pnpm --filter @atlas/api identity:migrate
      - name: Verify repeatable migration
        run: pnpm --filter @atlas/api identity:migrate
      - name: Run Identity HTTP and PostgreSQL gates
        run: pnpm --filter @atlas/api identity:test
      - name: Cleanup this Identity project only
        if: always()
        run: docker compose -p atlas-id01-identity-ci -f apps/api/compose.identity.yml down --volumes

  int02-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run isolated INT-02 PostgreSQL 17 and TLS gates
        id: int02
        # Fixed loopback fixture only. Runner refuses existing resources and
        # remote Docker, accepts no arguments, and cleans its own project in finally.
        run: node apps/api/scripts/supabase-local.mjs
      - name: Cleanup only the INT-02 project reserved by this runner
        if: always() && steps.int02.outputs.owned == 'true'
        run: docker compose -p atlas-int02-readonly-local -f apps/api/compose.spike.yml down --volumes
