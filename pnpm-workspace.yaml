packages:
  - apps/*
  - packages/*
allowBuilds:
  "@prisma/engines": true
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@nestjs/common@12.1.3"
  - "@nestjs/core@12.1.3"
  - "@nestjs/platform-express@12.1.3"
  - "@nestjs/testing@12.1.3"
  - "@typescript-eslint/eslint-plugin@8.71.2"
  - "@typescript-eslint/parser@8.71.2"
  - "@typescript-eslint/project-service@8.71.2"
  - "@typescript-eslint/scope-manager@8.71.2"
  - "@typescript-eslint/tsconfig-utils@8.71.2"
  - "@typescript-eslint/type-utils@8.71.2"
  - "@typescript-eslint/types@8.71.2"
  - "@typescript-eslint/typescript-estree@8.71.2"
  - "@typescript-eslint/utils@8.71.2"
  - "@typescript-eslint/visitor-keys@8.71.2"
  - "@vitest/mocker@5.0.4"
  - "@vitest/spy@5.0.4"
  - typescript-eslint@8.71.2
  - vitest@5.0.4
# Scoped security fixes; remove when Prisma 7 ships these dependency updates.
# GHSA-ggr8-5vv4-36mx; local Prisma configs use plain records, not Maps.
overrides:
  "@prisma/config@7.10.0>deepmerge-ts": "8.0.0"
  # GHSA-3f6p-5ww8-9rcr and GHSA-rgwj-5xj2-c3m3.
  "prisma@7.10.0>mysql2": "3.23.1"
